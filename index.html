<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>RiseTask — To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="card profile">
        <div class="avatar" id="avatar" aria-hidden="true">?</div>
        <div class="profile-info">
          <h2 id="profileName">Belum diisi</h2>
          <p id="profileRole">Jabatan belum diisi</p>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="editProfileBtn">Edit</button>
      </div>

      <div class="card clock">
        <p class="clock-day" id="currentDay">-</p>
        <p class="clock-date" id="currentDate">-</p>
        <p class="clock-time" id="currentTime">--:--:--</p>
      </div>
    </header>

    <section class="card">
      <h1 class="section-title">Tambah Tugas</h1>
      <form id="taskForm" novalidate>
        <div class="field" id="taskField">
          <label for="taskInput">Tugas</label>
          <textarea id="taskInput" name="task" rows="3" maxlength="200"
            placeholder="Contoh: Menyusun laporan mingguan tim marketing"></textarea>
          <div class="field-foot">
            <small class="error-msg" id="taskError" aria-live="polite"></small>
            <small class="counter"><span id="charCount">0</span>/200</small>
          </div>
        </div>

        <div class="field" id="priorityField">
          <span class="label">Level Prioritas</span>
          <div class="priority-group" role="radiogroup" aria-label="Level prioritas">
            <label class="chip chip-low">
              <input type="radio" name="priority" value="low"><span>Low</span>
            </label>
            <label class="chip chip-medium">
              <input type="radio" name="priority" value="medium"><span>Medium</span>
            </label>
            <label class="chip chip-high">
              <input type="radio" name="priority" value="high"><span>High</span>
            </label>
          </div>
          <small class="error-msg" id="priorityError" aria-live="polite"></small>
        </div>

        <div class="field" id="dueField">
          <label for="dueInput">Tanggal Dikerjakan / Deadline</label>
          <input type="date" id="dueInput" name="due">
          <small class="error-msg" id="dueError" aria-live="polite"></small>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Submit</button>
      </form>
    </section>

    <section class="card toolbar">
      <div class="filter">
        <label for="filterDate">Tampilkan tugas untuk tanggal</label>
        <div class="filter-row">
          <input type="date" id="filterDate">
          <button type="button" class="btn btn-ghost" id="todayFilterBtn">Hari ini</button>
          <button type="button" class="btn btn-ghost" id="clearFilterBtn">Semua</button>
          <button type="button" class="btn btn-danger" id="deleteAllBtn">Delete All</button>
        </div>
        <small class="filter-info" id="filterInfo">Menampilkan semua tugas</small>
      </div>
    </section>

    <main class="board">
      <section class="card column">
        <div class="column-head">
          <h3>To Do</h3><span class="count" id="todoCount">0</span>
        </div>
        <ul class="task-list" id="todoList"></ul>
      </section>

      <section class="card column column-overdue">
        <div class="column-head">
          <h3>Overdue</h3><span class="count" id="overdueCount">0</span>
        </div>
        <ul class="task-list" id="overdueList"></ul>
      </section>

      <section class="card column column-done">
        <div class="column-head">
          <h3>Done</h3><span class="count" id="doneCount">0</span>
        </div>
        <ul class="task-list" id="doneList"></ul>
      </section>
    </main>

  </div>

  <div class="modal" id="profileModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
      <h2 id="profileTitle">Profil Kamu</h2>
      <p class="modal-sub">Isi nama dan jabatan supaya aplikasi mengenali kamu.</p>
      <form id="profileForm" novalidate>
        <div class="field" id="nameField">
          <label for="nameInput">Nama</label>
          <input type="text" id="nameInput" maxlength="50" placeholder="Contoh: Budi Santoso" autocomplete="name">
          <small class="error-msg" id="nameError" aria-live="polite"></small>
        </div>
        <div class="field" id="roleField">
          <label for="roleInput">Jabatan</label>
          <input type="text" id="roleInput" maxlength="50" placeholder="Contoh: Staff Marketing" autocomplete="organization-title">
          <small class="error-msg" id="roleError" aria-live="polite"></small>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelProfileBtn">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/script.js"></script>
</body>
</html>
